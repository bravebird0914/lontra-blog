<body>
  <!-- サイドバー -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="profile-image-wrapper">
        <a href="index.html" class="profile-image-link">
          <img src="images/profile.png" alt="lontra" class="profile-image" />

        <li><a href="https://iggy157.github.io/" target="_blank">iggy157</a></li>
      </ul>
    </nav>

  <!-- 日付表示 -->
  <div id="current-date" class="current-date">
    <span class="date-year"></span>
    <span class="date-separator">.</span>
    <span class="date-month-day"></span>
    <span class="date-weekday"></span>
  </div>

  <!-- Dark Mode Toggle -->
  <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="ダークモード切り替え">
    <span class="toggle-icon">
      <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>

        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <article class="blog-article">
      <header class="blog-article-header">
        <!-- 【編集箇所】日付とカテゴリー -->
        <div class="blog-article-meta">
          <span class="blog-article-date">2024.12.XX</span>
          <span class="blog-article-category">カテゴリー名</span>
        </div>
        <!-- 【編集箇所】記事タイトル -->
        <h1 class="blog-article-title">記事タイトルをここに入力</h1>
        <!-- 【編集箇所】記事の要約 -->
        <p class="blog-article-excerpt">
          記事の導入文や要約をここに書きます。読者の興味を引く内容で始めましょう。
        </p>
      </header>
      
      <!-- 【編集箇所】記事本文 -->
      <div class="blog-article-content">
        <p>
          記事の本文をここに書きます。

        <h2>まとめ</h2>
        <p>
          記事のまとめをここに書きます。
        </p>
      </div>

      <footer class="blog-article-footer">
        <a href="index.html" class="blog-back-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>記事一覧</span>
        </a>
      </footer>
    </article>
  </main>

  <script src="js/main.js"></script>
